services:
  ideahub:
    build: .
    container_name: ideahub
    ports:
      - "${IDEAHUB_PORT:-5173}:5173"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MEMOS_BASE_URL: ${MEMOS_BASE_URL:-http://memos:5230}
      MEMOS_ACCESS_TOKEN: ${MEMOS_ACCESS_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - memos
    restart: unless-stopped

  memos:
    image: neosmemo/memos:stable
    container_name: ideahub-memos
    ports:
      - "${MEMOS_PORT:-5230}:5230"
    volumes:
      - memos-data:/var/opt/memos
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ideahub-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - ideahub
    restart: unless-stopped

volumes:
  memos-data:
