name: Build Android APK

# Produces an installable APK on GitHub's runners, so no local Java/Android SDK
# is required. Run it manually from the Actions tab, or let it run on a version
# tag (which also attaches the APK to a GitHub Release).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.2.1 / AGP 8.2.1 are officially supported on Java 17.
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble web bundle and sync into Android project
        run: |
          npm run build:www
          npx cap sync android

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IDEAAHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ideahub-release.jks"
            echo "path=$RUNNER_TEMP/ideahub-release.jks" >> "$GITHUB_OUTPUT"
            echo "Configured with the repository release keystore."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 IDEAAHUB_KEYSTORE_BASE64，release APK 将使用 debug 密钥签名（可直接安装，但不适合上架）。"
          fi

      - name: Build APK
        env:
          IDEAAHUB_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IDEAAHUB_KEYSTORE_PASSWORD: ${{ secrets.IDEAAHUB_KEYSTORE_PASSWORD }}
          IDEAAHUB_KEY_ALIAS: ${{ secrets.IDEAAHUB_KEY_ALIAS }}
          IDEAAHUB_KEY_PASSWORD: ${{ secrets.IDEAAHUB_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Verify the APK actually contains the app
        run: |
          set -euo pipefail
          APK=$(find out -name "*.apk" | head -1)
          echo "检查 $APK"
          unzip -l "$APK" | grep -E "assets/public/(index.html|app.js|styles.css)" \
            || { echo "::error::APK 缺少 Web 资源"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" \
            || { echo "::error::APK 缺少 classes.dex"; exit 1; }
          echo "APK 内容校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
