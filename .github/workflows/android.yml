name: Build Android APK

# Produces an installable APK on GitHub's runners, so no local Java/Android SDK
# is required. Run it manually from the Actions tab, or let it run on a version
# tag (which also attaches the APK to a GitHub Release).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.2.1 / AGP 8.2.1 are officially supported on Java 17.
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate the preinstalled Android SDK
        # GitHub's ubuntu runners already ship the Android SDK and export
        # ANDROID_HOME / ANDROID_SDK_ROOT. Using android-actions/setup-android
        # here fails the whole job, so just confirm what is available and make
        # sure the API level this project compiles against is installed.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::未找到预装的 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 为空）"
            exit 1
          fi
          echo "SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Assemble web bundle and sync into Android project
        run: |
          npm run build:www
          npx cap sync android

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IDEAAHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ideahub-release.jks"
            echo "path=$RUNNER_TEMP/ideahub-release.jks" >> "$GITHUB_OUTPUT"
            echo "Configured with the repository release keystore."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 IDEAAHUB_KEYSTORE_BASE64，release APK 将使用 debug 密钥签名（可直接安装，但不适合上架）。"
          fi

      - name: Build APK
        env:
          IDEAAHUB_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IDEAAHUB_KEYSTORE_PASSWORD: ${{ secrets.IDEAAHUB_KEYSTORE_PASSWORD }}
          IDEAAHUB_KEY_ALIAS: ${{ secrets.IDEAAHUB_KEY_ALIAS }}
          IDEAAHUB_KEY_PASSWORD: ${{ secrets.IDEAAHUB_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Verify the APK actually contains the app
        run: |
          set -euo pipefail
          APK=$(find out -name "*.apk" | head -1)
          echo "检查 $APK"
          unzip -l "$APK" | grep -E "assets/public/(index.html|app.js|styles.css)" \
            || { echo "::error::APK 缺少 Web 资源"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" \
            || { echo "::error::APK 缺少 classes.dex"; exit 1; }
          echo "APK 内容校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            ## Android 版安装说明

            下载下方的 `app-release.apk`，在手机上打开并安装。

            - 首次安装时，系统可能提示「未知来源」或「为了安全，你的手机不允许安装未知应用」。
              请在提示中允许来自浏览器/文件管理器的安装，然后重试。
            - 本应用**不需要服务器**，也不需要登录。所有记录保存在手机本地。
            - 首次使用请打开右上角「设置 → 模型服务」，填入你自己的 API Key
              （DeepSeek、智谱、硅基流动等都可以），否则「AI 整理」无法使用。
              记录、浏览、日历、汇报等基础功能无需配置即可使用。

            ## 关于签名

            如果本仓库未配置发布签名密钥（`IDEAAHUB_KEYSTORE_BASE64`），APK 会使用 Android
            调试密钥签名：可以直接安装使用，但不适合提交到应用商店。
