name: Build Android APK

# Produces an installable APK on GitHub's runners, so no local Java/Android SDK
# is required. Run it manually from the Actions tab, or let it run on a version
# tag (which also attaches the APK to a GitHub Release).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle 8.2.1 / AGP 8.2.1 are officially supported on Java 17.
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Verify the Android SDK
        shell: bash
        # GitHub's ubuntu runners already ship the Android SDK and export
        # ANDROID_HOME / ANDROID_SDK_ROOT, so never overwrite them — just report
        # what is available and make sure API 34 is installed. Everything here is
        # non-fatal except a genuinely missing SDK.
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::未找到预装的 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 为空）"
            exit 1
          fi
          echo "SDK 目录: $SDK"
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            echo "sdkmanager 存在，确保 API 34 与 build-tools 已安装"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true
          else
            echo "未找到 sdkmanager（预装 SDK 通常已包含所需组件），跳过"
          fi

      - name: Set up Gradle
        # Downloads and caches the Gradle distribution plus build dependencies.
        # Doing this explicitly avoids relying on the wrapper's own bootstrap,
        # which is the part most likely to behave differently on a clean runner.
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble web bundle and sync into Android project
        shell: bash
        run: |
          npm run build:www
          npx cap sync android

      - name: Restore release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IDEAAHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ideahub-release.jks"
            echo "path=$RUNNER_TEMP/ideahub-release.jks" >> "$GITHUB_OUTPUT"
            echo "Configured with the repository release keystore."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 IDEAAHUB_KEYSTORE_BASE64，release APK 将使用 debug 密钥签名（可直接安装，但不适合上架）。"
          fi

      - name: Build APK
        shell: bash
        env:
          IDEAAHUB_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          IDEAAHUB_KEYSTORE_PASSWORD: ${{ secrets.IDEAAHUB_KEYSTORE_PASSWORD }}
          IDEAAHUB_KEY_ALIAS: ${{ secrets.IDEAAHUB_KEY_ALIAS }}
          IDEAAHUB_KEY_PASSWORD: ${{ secrets.IDEAAHUB_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -uo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | head -2
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "--- gradlew 权限 ---"; ls -l gradlew
          [ -f local.properties ] || echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "--- local.properties ---"; cat local.properties

          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          echo "执行任务: $TASK"

          set +e
          OUTPUT=$(./gradlew --no-daemon --stacktrace "$TASK" 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            echo "=================================================="
            echo "::error::Gradle 构建失败（$TASK，退出码 $STATUS）"
            printf '%s\n' "$OUTPUT" | tail -40
            echo "=================================================="
            exit $STATUS
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/ || true

      - name: Verify the APK actually contains the app
        shell: bash
        run: |
          set -uo pipefail
          APK=$(find out -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::没有找到任何 APK"; exit 1; }
          echo "检查 $APK"
          unzip -l "$APK" | grep -E "assets/public/(index.html|app.js|styles.css)" \
            || { echo "::error::APK 缺少 Web 资源"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" \
            || { echo "::error::APK 缺少 classes.dex"; exit 1; }
          echo "APK 内容校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            ## Android 版安装说明

            下载下方的 `app-release.apk`，在手机上打开并安装。

            - 首次安装时，系统可能提示「未知来源」或「为了安全，你的手机不允许安装未知应用」。
              请在提示中允许来自浏览器/文件管理器的安装，然后重试。
            - 本应用**不需要服务器**，也不需要登录。所有记录保存在手机本地。
            - 首次使用请打开右上角「设置 → 模型服务」，填入你自己的 API Key
              （DeepSeek、智谱、硅基流动等都可以），否则「AI 整理」无法使用。
              记录、浏览、日历、汇报等基础功能无需配置即可使用。

            ## 关于签名

            如果本仓库未配置发布签名密钥（`IDEAAHUB_KEYSTORE_BASE64`），APK 会使用 Android
            调试密钥签名：可以直接安装使用，但不适合提交到应用商店。
