name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        if: runner.os == 'macOS'
        run: npm run folder:mac

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run folder:win

      - name: Build Linux
        if: runner.os == 'Linux'
        run: npm run folder:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-${{ runner.os }}
          path: dist/
