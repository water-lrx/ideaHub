name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.0"
        required: true
        default: "v0.3.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: Build macOS folder apps
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app folders
        run: npm run folder:mac -- --x64 --arm64

      - name: Create macOS folder archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in dist/mac*/IdeaHub.app; do
            folder="$(basename "$(dirname "$app")")"
            arch="${folder#mac-}"
            if [ "$arch" = "mac" ]; then
              arch="x64"
            fi
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist/IdeaHub-mac-${arch}-folder.zip"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-macos-folders
          path: dist/IdeaHub-mac-*-folder.zip
          if-no-files-found: error

  windows:
    name: Build Windows folder app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app folder
        run: npm run folder:win

      - name: Create Windows folder archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\win-unpacked -DestinationPath dist\IdeaHub-windows-x64-folder.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-windows-folder
          path: dist/IdeaHub-windows-x64-folder.zip
          if-no-files-found: error

  linux:
    name: Build Linux folder app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app folder
        run: npm run folder:linux

      - name: Create Linux folder archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf dist/IdeaHub-linux-x64-folder.tar.gz linux-unpacked

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ideahub-linux-folder
          path: dist/IdeaHub-linux-x64-folder.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [mac, windows, linux]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
